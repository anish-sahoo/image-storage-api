<div class="nav">
    <span class="nav-brand">Photo Storage</span>
    <div class="nav-right">
        <span class="nav-user">{{.Username}}</span>
        <button class="btn btn-logout" hx-post="/logout" hx-swap="none">Logout</button>
    </div>
</div>
<div class="dashboard">
    <div>
        <div class="panel">
            <div class="panel-title">Upload File</div>
            <form id="upload-form"
                hx-post="/images"
                hx-target="#upload-result"
                hx-encoding="multipart/form-data"
                hx-swap="innerHTML">
                <div class="form-group">
                    <label>File</label>
                    <input type="file" name="file" required>
                </div>
                <div class="form-group">
                    <label>Tag</label>
                    <select name="tag" required>
                        <option value="">Select a tag</option>
                        <option value="image">Image</option>
                        <option value="blog">Blog</option>
                        <option value="personal">Personal</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">
                    <span class="htmx-indicator">Uploading...</span>
                    <span>Upload</span>
                </button>
            </form>
            <div id="upload-result"></div>
        </div>
    </div>
    <div>
        <div class="files-header">
            <span class="files-title">Files</span>
            <button class="btn btn-view" hx-get="/images" hx-target="#file-list" hx-swap="innerHTML">Refresh</button>
        </div>
        <div id="file-list"
            hx-get="/images"
            hx-trigger="load, refresh-file-list from:body"
            hx-swap="innerHTML">
        </div>
    </div>
</div>
