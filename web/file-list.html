{{if .}}
<div class="file-grid">
{{range .}}
<div class="file-card" id="file-{{.ID}}">
    {{if isImage .Filetype}}
    <div class="file-thumb">
        <img src="/api/images/{{.ID}}/download" alt="{{.Name}}" loading="lazy">
    </div>
    {{else}}
    <div class="file-thumb file-icon-thumb">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
        </svg>
        <span class="file-ext">{{.Filetype}}</span>
    </div>
    {{end}}
    <div class="file-body">
        <div class="file-name" title="{{.Name}}">{{.Name}}</div>
        <div class="file-meta">
            <span class="tag-badge tag-{{.Tag}}">{{.Tag}}</span>
            <span>{{formatSize .FileSizeBytes}}</span>
            <span>{{formatDate .CreatedAt}}</span>
        </div>
        <div class="file-actions">
            <a href="/api/images/{{.ID}}/download" class="btn btn-view" target="_blank">View</a>
            <button class="btn btn-danger"
                hx-delete="/images/{{.ID}}/delete"
                hx-target="#file-{{.ID}}"
                hx-swap="outerHTML swap:0.3s"
                hx-confirm="Delete '{{.Name}}'?">
                Delete
            </button>
        </div>
    </div>
</div>
{{end}}
</div>
{{else}}
<div class="empty-state">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
    </svg>
    <p>No files yet. Upload something to get started.</p>
</div>
{{end}}
